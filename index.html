<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <main class="app">
        <header class="app-header">
            <div class="title-row">
                <h1>My Tasks</h1>
                <div class="date-chip" id="date-chip"></div>
            </div>
            <p class="subtitle">Stay organised, one task at a time.</p>
            <div class="progress">
                <div class="progress-top">
                    <span>Progress</span>
                    <span id="progress-label">0 / 0 done</span>
                </div>
                <div class="progress-track">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </header>

        <form id="todo-form" class="add-form">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" maxlength="200">
            <button type="submit" aria-label="Add task">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </form>

        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off">
            <button id="search-clear" aria-label="Clear search" class="hidden">&times;</button>
        </div>

        <div class="filters" role="tablist">
            <button class="filter-btn active" data-filter="all">All <span class="filter-count" id="count-all">0</span></button>
            <button class="filter-btn" data-filter="active">Active <span class="filter-count" id="count-active">0</span></button>
            <button class="filter-btn" data-filter="completed">Done <span class="filter-count" id="count-completed">0</span></button>
        </div>

        <ul id="todo-list"></ul>

        <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <p id="empty-title">All clear!</p>
            <span id="empty-sub">Add a task above to get started.</span>
        </div>

        <footer class="app-footer">
            <span id="task-count" class="count-pill">0 left</span>
            <button id="clear-completed" aria-label="Clear completed tasks">Clear completed</button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
